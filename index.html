      const touchStartY = useRef(null);

        setToastMessage(msg);

        if (!currentProject) return;
        const targetId = currentProject.id;

      const handleTouchStart = (e) => {
        if (e.touches.length !== 1) return;
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
      };

      const handleTouchEnd = (e) => {
        if (touchStartX.current === null || touchStartY.current === null || e.changedTouches.length !== 1) return;
        const el = e.target;
        if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || (el.closest && el.closest('.overflow-x-auto')))) {
          touchStartX.current = null;
          touchStartY.current = null;
          return;
        }
        const dx = e.changedTouches[0].clientX - touchStartX.current;
        const dy = e.changedTouches[0].clientY - touchStartY.current;
        if (Math.abs(dx) > 75 && Math.abs(dx) > Math.abs(dy) * 1.8) {
          if (dx < 0) setCurrentSlideIndex((p) => Math.min(totalSlides - 1, p + 1));
          else setCurrentSlideIndex((p) => Math.max(0, p - 1));
        }
        touchStartX.current = null;
        touchStartY.current = null;

        const userMsg = { id: 'u-' + Date.now(), role: 'user', content: trimmed, timestamp: 'Now' };
        const lower = trimmed.toLowerCase();
        let reply = 'Awesome strategy idea! 🇬🇧✨\nTo shift Marmite from a notorious "gag/dare food" into an **Ultimate British Umami Secret Weapon**, showing visitors that **Marmite is made from yeast fermentation — rich in natural glutamates just like Japanese Miso and Soy Sauce** — will really spark curiosity!';

          { title: 'Set up a "Love It or Love It!" sticker voting board for visitors who try the live toast tasting', estimatedMinutes: 30, assigneeRole: 'kid', team: 'team_b', sprintWeek: 3 }
        ];

        if (lower.includes('team a') || lower.includes('import') || lower.includes('landed') || lower.includes('price') || lower.includes('輸入') || lower.includes('原価')) {
          reply = 'Great focus for **Team A: Import & Finance**! 📦💷\nWhen importing Marmite from the UK to Tokyo, the key is calculating your **Landed Cost per Jar** (UK wholesale cost + shipping + FX fee ÷ 30 jars).\n\nIf our all-in cost is around ¥770/jar, **what retail price (bundled with your bilingual Recipe ZINE) will parents and foodies at the BST Spring Fair happily pay?**';

            { title: 'Compare 3 UK B2B wholesale suppliers for 30-jar case pricing and UK-to-Tokyo shipping rates', estimatedMinutes: 35, assigneeRole: 'kid', team: 'team_a', sprintWeek: 2 },

            { title: 'Design the "3-Step Golden Ratio Tasting Card" (Warm Toast + Salted Butter + Paper-thin Marmite)', estimatedMinutes: 40, assigneeRole: 'kid', team: 'team_b', sprintWeek: 3 },

                </div>
                <form onSubmit={handleCreateProjectWithAi} className="space-y-3">
                  {newProjMode === 'interview' ? (
                    <>
                      <input type="text" required value={ideaInput} onChange={(e) => setIdeaInput(e.target.value)} placeholder="Q1. What project or event do you want to launch? *" className="w-full border-2 border-amber-300 rounded-xl px-3 py-2.5 text-xs sm:text-sm font-bold" />
                      <input type="text" value={audienceInput} onChange={(e) => setAudienceInput(e.target.value)} placeholder="Q2. Event name & target audience (e.g., School Fair)" className="w-full border-2 border-sky-300 rounded-xl px-3 py-2.5 text-xs sm:text-sm font-bold" />
                      <input type="text" value={supportInput} onChange={(e) => setSupportInput(e.target.value)} placeholder="Q3. What should parents or teachers help with?" className="w-full border-2 border-rose-300 rounded-xl px-3 py-2.5 text-xs sm:text-sm font-bold" />
                    </>
                  ) : (
                    <textarea rows={5} required value={proposalInput} onChange={(e) => setProposalInput(e.target.value)} placeholder="Paste your full Project Proposal document or meeting notes here..." className="w-full border-2 border-slate-300 rounded-xl p-3 text-xs sm:text-sm font-semibold"></textarea>
                  )}
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsNewProjectModalOpen(false)} className="px-4 py-2 rounded-xl border border-slate-300 text-xs font-extrabold">Cancel</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-amber-500 text-white text-xs font-extrabold cursor-pointer">✨ Build Project with AI →</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {toastMessage && (
            <div className="fixed bottom-20 lg:bottom-5 right-4 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-lg text-xs font-extrabold border-2 border-amber-400">
              {toastMessage}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
